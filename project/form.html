<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Castle Explorer</title>
    <meta name="description"
        content="A form to fill out to create a mini and basic travel plan to the castles, and a small photo of your favorite castles.">
    <meta name="author" content="Iara Agostina Arias">
    <link rel="stylesheet" href="styles/base.css">
    <script src="scripts/base.js" defer></script>
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@447&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <img class="logo" src="images/castle-logo-banana.svg" alt="" width="200">
        <span class="site-title">World Castle Explorer</span>
        <button id="menuBtn" aria-label="Menu Button"></button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="castles.html">Castle</a></li>
                <li><a href="form.html">Book a Trip</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form action="yourPlan.html" method="get" class="wf1">
            <fieldset>
                <fieldset>
                    <legend>Your Information</legend>
                    <label for="userName">First Name<input type="text" name="fname" id="userName" required></label>
                    <label for="userLName">Last Name<input type="text" name="lname" id="userLName" required></label>

                    <!-- <label for="userEmail">Email (Optional, if you would like to received news about the castles)<input type="email" name="uEmail"
                    id="userEmail" placeholder="someone@gmail.com"></label> -->
                </fieldset>

                <fieldset>
                    <legend>Select a Castle</legend>
                    <label for="castleOpt">
                        <select name="castles" id="castleOpt" required>
                            <option value="" disabled selected>Select a Castle &#9662;</option>
                        </select>
                    </label>

                    <label for="date">
                        <input type="date" name="tripDate" id="date">
                    </label>
                </fieldset>

                <fieldset>
                    <legend>Addiotional</legend>
                    <label for="comments">Notes (if you have something specific you want to save for this
                        castle)<textarea name="comments" id="comments"></textarea></label>
                </fieldset>

                <input type="submit" value="Create Your Plan">
            </fieldset>
        </form>
    </main>

    <footer>
        <p><span id="currentyear"></span></p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
